stages:
  snapshot_demo:
    cmd: >-
      python -m src.snapshot
      --inbox data/scenarios/conservador-demo-v1/inbox
      --ledger data/ingestion/conservador-demo-v1.json
      --cutoff 2017-08-01T13:00:00Z
      --output data/processed/dvc-demo/2017-08-01
    deps:
      - data/scenarios/conservador-demo-v1/inbox
      - data/ingestion/conservador-demo-v1.json
      - src/deliveries.py
      - src/ingest.py
      - src/snapshot.py
      - requirements/tools.lock
      - docker/tools.Dockerfile
    outs:
      - data/processed/dvc-demo/2017-08-01
  baseline_fit:
    cmd: >-
      python -m src.baseline fit
      --snapshot data/processed/dvc-demo/2017-08-01
      --config config/baseline.json
      --output models/baseline-demo
    deps:
      - data/processed/dvc-demo/2017-08-01
      - config/baseline.json
      - src/baseline.py
      - src/validate_snapshot.py
      - src/deliveries.py
      - src/ingest.py
      - requirements/tools.lock
    outs:
      - models/baseline-demo
  baseline_predict:
    cmd: >-
      python -m src.baseline predict
      --model models/baseline-demo
      --output forecasts/baseline-demo
    deps:
      - models/baseline-demo
      - src/baseline.py
      - src/validate_snapshot.py
      - src/deliveries.py
      - src/ingest.py
      - requirements/tools.lock
    outs:
      - forecasts/baseline-demo
  evaluation_context:
    cmd: >-
      python -m src.evaluation prepare
      --inbox data/scenarios/evaluacion-julio-v1/inbox
      --protocol config/evaluation.json
      --output data/evaluation/dev-context-v1
    deps:
      - data/scenarios/evaluacion-julio-v1/inbox
      - config/evaluation.json
      - src/evaluation.py
      - src/replay.py
      - src/metrics.py
      - src/baseline.py
      - src/snapshot.py
      - src/deliveries.py
      - src/ingest.py
      - src/validate_snapshot.py
      - requirements/tools.lock
    outs:
      - data/evaluation/dev-context-v1
  baseline_backtest:
    cmd: >-
      python -m src.evaluation baseline
      --context data/evaluation/dev-context-v1
      --config config/baseline.json
      --output data/evaluation/baseline-dev-v1
    deps:
      - data/evaluation/dev-context-v1
      - config/baseline.json
      - src/evaluation.py
      - src/replay.py
      - src/metrics.py
      - src/baseline.py
      - src/snapshot.py
      - src/deliveries.py
      - src/ingest.py
      - src/validate_snapshot.py
      - requirements/tools.lock
    outs:
      - data/evaluation/baseline-dev-v1
  ml_backtest:
    cmd: >-
      python -m src.evaluate_ml
      --context data/evaluation/dev-context-v1
      --baseline-config config/baseline.json
      --config config/ml.json
      --output data/evaluation/ml-dev-v1
    deps:
      - data/evaluation/dev-context-v1
      - config/baseline.json
      - config/ml.json
      - src/features.py
      - src/ml.py
      - src/evaluate_ml.py
      - src/evaluation.py
      - src/baseline.py
      - src/metrics.py
      - src/snapshot.py
      - src/deliveries.py
      - src/ingest.py
      - src/replay.py
      - src/validate_snapshot.py
      - requirements/tools.lock
      - docker/ml/requirements.lock
      - docker/ml/Dockerfile
    outs:
      - data/evaluation/ml-dev-v1
  model_comparison:
    cmd: >-
      python -m src.selection
      --baseline data/evaluation/baseline-dev-v1/metrics.json
      --candidate data/evaluation/ml-dev-v1/metrics.json
      --policy config/model-selection.json
      --output data/evaluation/comparison-v1
    deps:
      - data/evaluation/baseline-dev-v1
      - data/evaluation/ml-dev-v1
      - config/model-selection.json
      - src/selection.py
      - src/baseline.py
      - src/deliveries.py
      - src/ingest.py
      - requirements/tools.lock
    outs:
      - data/evaluation/comparison-v1
  orders_configured:
    cmd: >-
      python -m src.orders
      --forecast forecasts/baseline-demo/forecast.csv
      --costs config/costs.json
      --output data/orders/configured-demo
    deps:
      - forecasts/baseline-demo
      - config/costs.json
      - src/orders.py
      - src/baseline.py
      - src/deliveries.py
      - src/ingest.py
      - requirements/tools.lock
    outs:
      - data/orders/configured-demo
  orders_example:
    cmd: >-
      python -m src.orders
      --forecast forecasts/baseline-demo/forecast.csv
      --costs config/examples/costs-relative-9-1.json
      --output data/orders/illustrative-9-1
    deps:
      - forecasts/baseline-demo
      - config/examples/costs-relative-9-1.json
      - src/orders.py
      - src/baseline.py
      - src/deliveries.py
      - src/ingest.py
      - requirements/tools.lock
    outs:
      - data/orders/illustrative-9-1
  business_example:
    cmd: >-
      python -m src.business_evaluation
      --context data/evaluation/dev-context-v1
      --baseline data/evaluation/baseline-dev-v1
      --candidate data/evaluation/ml-dev-v1
      --costs config/examples/costs-relative-9-1.json
      --output data/evaluation/business-example-9-1
    deps:
      - data/evaluation/dev-context-v1
      - data/evaluation/baseline-dev-v1
      - data/evaluation/ml-dev-v1
      - config/examples/costs-relative-9-1.json
      - src/orders.py
      - src/business_evaluation.py
      - src/evaluation.py
      - src/metrics.py
      - src/baseline.py
      - src/deliveries.py
      - src/ingest.py
      - src/replay.py
      - src/snapshot.py
      - src/validate_snapshot.py
      - requirements/tools.lock
    outs:
      - data/evaluation/business-example-9-1
  business_configured:
    cmd: >-
      python -m src.business_evaluation
      --context data/evaluation/dev-context-v1
      --baseline data/evaluation/baseline-dev-v1
      --candidate data/evaluation/ml-dev-v1
      --costs config/costs.json
      --output data/evaluation/business-configured-dev-v1
    deps:
      - data/evaluation/dev-context-v1
      - data/evaluation/baseline-dev-v1
      - data/evaluation/ml-dev-v1
      - config/costs.json
      - src/orders.py
      - src/business_evaluation.py
      - src/evaluation.py
      - src/metrics.py
      - src/baseline.py
      - src/deliveries.py
      - src/ingest.py
      - src/replay.py
      - src/snapshot.py
      - src/validate_snapshot.py
      - requirements/tools.lock
    outs:
      - data/evaluation/business-configured-dev-v1
