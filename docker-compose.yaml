# Airflow 3 con Docker Compose, adaptado de la arquitectura oficial 3.3.2 para una laptop:
# https://airflow.apache.org/docs/apache-airflow/3.3.2/docker-compose.yaml
# LocalExecutor + PostgreSQL. La lógica del producto es Python estándar: la imagen oficial
# basta y no se construye ninguna imagen propia.
name: laboratorio1
x-airflow-common: &airflow-common
  image: apache/airflow:3.3.2-python3.12
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: laboratorio1-local-development-secret
    AIRFLOW__API__WORKERS: '1'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: '15'
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: '1'
    PYTHONPATH: /opt/airflow/project
  volumes:
    - .:/opt/airflow/project
    - ./dataOriginal:/opt/airflow/project/dataOriginal:ro
    - ./.git:/opt/airflow/project/.git:ro
    - airflow-logs:/opt/airflow/logs
  user: '${AIRFLOW_UID:-1000}:0'
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'airflow']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  airflow-init:
    <<: *airflow-common
    user: '0:0'
    entrypoint: /bin/bash
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: 'true'
    # Prepara el volumen de logs para el usuario configurado y migra la base de datos.
    command:
      - -c
      - |
        chown -R "${AIRFLOW_UID:-1000}:0" /opt/airflow/logs
        exec /entrypoint airflow version
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - '127.0.0.1:${AIRFLOW_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/api/v2/monitor/health']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8974/health']
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ['CMD-SHELL', 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
volumes:
  postgres-db-volume:
  airflow-logs:
