name: laboratorio1-tools
services:
  tools:
    image: laboratorio1-tools:py312
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    init: true
    network_mode: none
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: bind
        source: ./dataOriginal
        target: /workspace/dataOriginal
        read_only: true
      - type: bind
        source: ./.git
        target: /workspace/.git
        read_only: true
      # Las operaciones locales no necesitan las credenciales de Google Drive.
      - type: bind
        source: /dev/null
        target: /workspace/.dvc/config.local
        read_only: true
  ml:
    extends:
      service: tools
    image: laboratorio1-ml:py312
    build:
      context: ./docker/ml
      dockerfile: Dockerfile
      additional_contexts:
        tools_base: service:tools
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
